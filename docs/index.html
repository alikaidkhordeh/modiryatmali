<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>داشبورد هزینه‌ها</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f2f3f8; --card:#ffffff; --text:#15171c; --muted:#7a8191; --line:rgba(20,23,28,.08);
  --a1:#6c5ce7; --a2:#00b4d8; --good:#12b886; --warn:#f59f00; --bad:#f03e3e; --shadow:0 8px 28px rgba(40,45,80,.09);
  --top:var(--tg-content-safe-area-inset-top,0px); --bottom:var(--tg-safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
}
[data-theme=dark]{
  --bg:#0c0e13; --card:#161921; --text:#f2f4f8; --muted:#8b92a5; --line:rgba(255,255,255,.07);
  --a1:#8b7bff; --a2:#38d0f5; --good:#38d9a9; --warn:#ffc078; --bad:#ff6b6b; --shadow:0 8px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:Vazirmatn,"Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;line-height:1.6}
main{max-width:520px;margin:0 auto;padding:calc(14px + var(--top)) 14px calc(28px + var(--bottom));display:grid;gap:14px}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow);
  opacity:0;transform:translateY(14px);animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}.card:nth-child(4){animation-delay:.21s}
.card:nth-child(5){animation-delay:.28s}.card:nth-child(6){animation-delay:.35s}.card:nth-child(7){animation-delay:.42s}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none;opacity:1;transform:none}*{transition:none!important}}
h2{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-size:11.5px;font-weight:400;color:var(--muted)}
.muted{color:var(--muted)}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;border-radius:26px;padding:22px 20px 18px;
  background:linear-gradient(135deg,var(--a1),var(--a2))}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.22;background:#fff}
.hero::before{width:190px;height:190px;left:-60px;top:-80px;animation:float 9s ease-in-out infinite}
.hero::after{width:120px;height:120px;right:-30px;bottom:-50px;animation:float 11s ease-in-out infinite reverse}
@keyframes float{50%{transform:translate(18px,14px) scale(1.08)}}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;opacity:.92}
.badge{background:rgba(255,255,255,.25);padding:2px 10px;border-radius:99px;font-size:12px}
.total{margin:8px 0 12px;display:flex;align-items:baseline;gap:8px}
.total b{font-size:38px;font-weight:800;letter-spacing:-.5px}
.total small{font-size:14px;opacity:.9}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(255,255,255,.2);backdrop-filter:blur(6px);padding:4px 11px;border-radius:99px;font-size:12.5px}
.chip.up{background:rgba(255,80,80,.35)}.chip.down{background:rgba(40,210,150,.35)}
.budget{margin-top:14px;font-size:12.5px}
.budget .lbl{display:flex;justify-content:space-between;margin-bottom:6px;opacity:.95}
.btrack{position:relative;height:10px;border-radius:10px;background:rgba(255,255,255,.25);overflow:visible}
.btrack i{position:absolute;inset:0 0 0 auto;width:0;border-radius:10px;background:#fff;transition:width 1.2s cubic-bezier(.25,.8,.25,1)}
.btrack i.over{background:#ffd8d8}
.btrack .pace{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:rgba(255,255,255,.9);box-shadow:0 0 0 2px rgba(0,0,0,.08)}

/* donut */
.donutWrap{position:relative;width:min(260px,78%);margin:4px auto 14px}
#donut{width:100%;display:block;overflow:visible}
.seg{transition:stroke-dasharray 1s cubic-bezier(.25,.8,.25,1),stroke-width .25s,opacity .25s;cursor:pointer}
.seg.active{stroke-width:29}.seg.dim{opacity:.3}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;pointer-events:none;padding:0 22%}
.center .big{font-size:20px;font-weight:800}
.center .sub{font-size:12px;color:var(--muted)}
.legend{display:grid;gap:4px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 8px;border-radius:14px;cursor:pointer;
  transition:background .2s}
.row.active{background:var(--line)}
.dot{width:10px;height:10px;border-radius:50%}
.row .name{font-size:14px}
.row .val{font-size:13.5px;font-weight:700;text-align:left}
.row .pct{font-size:11.5px;color:var(--muted);font-weight:400;margin-inline-start:6px}
.ch{font-size:11px;font-weight:600;margin-inline-start:6px;padding:0 6px;border-radius:99px}
.ch.up{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.ch.down{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.ch.new{color:var(--muted);background:var(--line)}
.track{grid-column:1/-1;height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:-2px}
.track i{display:block;height:100%;width:0;border-radius:5px;transition:width 1s cubic-bezier(.25,.8,.25,1)}

/* charts */
svg{display:block;width:100%;overflow:visible}
.tip{min-height:22px;font-size:13px;margin-bottom:4px;color:var(--muted)}
.tip b{color:var(--text)}
.bar{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform .8s cubic-bezier(.2,.9,.25,1);cursor:pointer}
.go .bar{transform:scaleY(1)}
.bar.sel{filter:brightness(1.25)}
.cum{fill:none;stroke:var(--a2);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;
  transition:stroke-dashoffset 1.6s ease .3s;opacity:.9}
.go .cum{stroke-dashoffset:0}
.cumArea{opacity:0;transition:opacity 1s ease 1s}.go .cumArea{opacity:1}
.avgLine{stroke:var(--warn);stroke-width:1.4;stroke-dasharray:4 4;opacity:0;transition:opacity .8s ease 1.1s}
.paceLine{stroke:var(--bad);stroke-width:1.4;stroke-dasharray:2 4;fill:none;opacity:0;transition:opacity .8s ease 1.3s}
.go .avgLine,.go .paceLine{opacity:.9}
.axis{font-size:9.5px;fill:var(--muted);text-anchor:middle}
.hlab{font-size:10px;fill:var(--muted);text-anchor:middle}
.note{font-size:11px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 12px}
.key{display:inline-flex;align-items:center;gap:5px}
.key i{display:inline-block;width:14px;height:0;border-top:2px solid}
.hb{cursor:pointer}

/* lists */
.hbar{display:grid;gap:12px}
.hbar .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.hbar .track{height:8px;margin:0}
.exp{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.exp:first-child{border-top:0}
.exp .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px}
.exp .t{font-size:14px}.exp .d{font-size:11.5px;color:var(--muted)}
.exp .a{font-weight:700;font-size:14px}
.empty{text-align:center;padding:60px 20px}
.empty .big{font-size:54px}
footer{text-align:center;font-size:11.5px;color:var(--muted);padding:2px 10px 0}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
</style>
</head>
<body>
<main id="app">
  <section class="card hero">
    <div class="hero-top"><span id="monthLabel">—</span><span id="demo" class="badge" hidden>نمونه</span></div>
    <div class="total"><b id="total">۰</b><small>تومان</small></div>
    <div class="chips"><span id="delta" class="chip" hidden></span><span id="count" class="chip"></span>
      <span id="avg" class="chip"></span><span id="fc" class="chip" hidden></span></div>
    <div class="budget" id="budget" hidden>
      <div class="lbl"><span id="bLabel"></span><span id="bLeft"></span></div>
      <div class="btrack"><i id="bFill"></i><span class="pace" id="bPace" hidden></span></div>
    </div>
  </section>

  <section class="card" id="catCard">
    <h2>سهم هر دسته از هزینه‌ها <small>▲▼ نسبت به ماه قبل</small></h2>
    <div class="donutWrap"><svg id="donut" viewBox="0 0 200 200"></svg><div class="center" id="center"></div></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="card" id="dayCard">
    <h2>هزینهٔ هر روز</h2>
    <div class="tip" id="tip">روی ستون‌ها بزن</div>
    <svg id="daily" viewBox="0 0 340 170"></svg>
    <div class="note" id="dayNote"></div>
  </section>

  <section class="card" id="weekCard">
    <h2>روزهای هفته <small>جمع هزینه‌های هر روز هفته در این ماه</small></h2>
    <svg id="week" viewBox="0 0 340 130"></svg>
    <div class="note" id="weekNote"></div>
  </section>

  <section class="card" id="histCard">
    <h2>روند ماه‌های اخیر</h2>
    <div class="tip" id="htip"></div>
    <svg id="hist" viewBox="0 0 340 140"></svg>
    <div class="note"><span class="key"><i style="border-color:var(--warn);border-top-style:dashed"></i>میانگین</span><span>م = میلیون · ه = هزار</span></div>
  </section>

  <section class="card" id="peopleCard"><h2>به تفکیک افراد</h2><div class="hbar" id="people"></div></section>
  <section class="card" id="topCard"><h2>بزرگ‌ترین هزینه‌ها</h2><div id="top"></div></section>
  <footer id="stamp"></footer>
</main>

<script>
/* Data comes inside the link (?d=base64url JSON, built by bot/webapp.py). Keys:
   m month · t total · n count · p prev month total · c [name,total,count,emoji,color,prev] · d daily
   h [[month,total]] · u [[person,total]] · x biggest · l month length · e days elapsed · f forecast
   b budget · w [Sat..Fri] · s snapshot time. Older links without the new keys still work. */
const COLORS=["#ff7a59","#4cc9f0","#b388ff","#ffd166","#2ec4b6","#f78fb3","#ef476f","#06d6a0","#7bb7ff","#ff9f1c","#5ee7df","#ff6b9a","#9be564","#8d99ae","#c77dff","#80ed99"];
const colorOf=i=>COLORS[(i||0)%COLORS.length];
const MONTHS=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const WEEK=["شنبه","یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه"];
const FA="۰۱۲۳۴۵۶۷۸۹";

const fa=s=>String(s).replace(/\d/g,d=>FA[d]);
const fmt=n=>fa(Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,"٬"));
const short=n=>n>=1e6?fa((n/1e6).toFixed(1).replace(/\.0$/,"").replace(".","٫"))+" م":n>=1e3?fa(Math.round(n/1e3))+" ه":fa(Math.round(n));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const monthName=k=>MONTHS[parseInt(k.slice(5,7),10)-1]+" "+fa(k.slice(0,4));
const $=id=>document.getElementById(id);
const tg=window.Telegram&&window.Telegram.WebApp;
const haptic=()=>{try{tg.HapticFeedback.selectionChanged()}catch(e){}};

function decode(s){
  s=s.replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  const bin=atob(s), bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}

function demoData(){
  const d=[0,120e3,0,450e3,80e3,0,2.4e6,60e3,310e3,0,95e3,0,640e3,150e3,0,230e3,0,75e3,520e3,0,180e3,0,0,410e3,90e3];
  const t=d.reduce((a,b)=>a+b,0);
  return {m:"1405-08",t:t,n:41,p:6200000,l:30,e:25,f:Math.round(t/25*30),b:8000000,s:"1405-08-25 21:40",
    w:[1450000,820000,640000,410000,980000,690000,1020000],
    c:[["قسط",2400000,1,"💳",2,2400000],["خوراک",1450000,17,"🍽",0,1210000],["ماشین",820000,6,"🚗",1,990000],["خانه",640000,2,"🏠",3,640000],["خرید",540000,5,"🛍",8,180000],["حمل و نقل",310000,6,"🚕",5,0],["تفریح",210000,3,"🎬",9,350000]],
    d:d,h:[["1405-03",5300000],["1405-04",3900000],["1405-05",6800000],["1405-06",6200000],["1405-07",5900000],["1405-08",t]],
    u:[["خانمم",1250000],["مامان",420000]],
    x:[["قسط",2400000,"قسط ماشین",7,"💳",2],["خرید",540000,"کفش",13,"🛍",8],["خوراک",380000,"شام با خانمم",19,"🍽",0],["خانه",350000,"اجاره انبار",19,"🏠",3],["ماشین",310000,"بنزین",9,"🚗",1]]};
}

function countUp(el,to){
  const t0=performance.now(),dur=1000;
  (function tick(now){
    const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);
    el.textContent=fmt(to*e);
    if(p<1)requestAnimationFrame(tick);
  })(t0);
  setTimeout(()=>{el.textContent=fmt(to)},dur+200); // in case animation frames are paused
}

function renderHero(D){
  $("monthLabel").textContent=monthName(D.m)+(D.e?" · روز "+fa(D.e):"");
  countUp($("total"),D.t);
  $("count").textContent=fa(D.n)+" تراکنش";
  const days=D.e||D.d.length||1;
  $("avg").textContent="میانگین روزانه "+short(D.t/days);
  // running month: compare the month-end forecast, not the half-finished total
  const cmp=D.e?(D.f||0):D.t;
  if(D.p>0&&cmp>0){
    const pct=Math.round((cmp-D.p)/D.p*100), el=$("delta");
    el.hidden=false;
    el.className="chip "+(pct>0?"up":"down");
    el.textContent=(D.e?"روند ":"")+(pct>0?"▲ ":"▼ ")+fa(Math.abs(pct))+"٪ نسبت به ماه قبل";
  }
  if(D.f>0){$("fc").hidden=false;$("fc").textContent="🔮 پیش‌بینی آخر ماه "+short(D.f)}
  if(D.b>0){
    const pct=Math.round(D.t/D.b*100),left=D.b-D.t;
    $("budget").hidden=false;
    $("bLabel").textContent="🎯 "+fa(pct)+"٪ از بودجهٔ "+short(D.b);
    $("bLeft").textContent=left>=0?short(left)+" مانده":short(-left)+" بیشتر از بودجه";
    const fill=$("bFill");
    if(pct>100)fill.classList.add("over");
    setTimeout(()=>fill.style.width=Math.min(100,pct)+"%",200);
    if(D.e&&D.l){const p=$("bPace");p.hidden=false;p.style.right="calc("+(D.e/D.l*100)+"% - 1px)";p.title="جایی که طبق بودجه باید باشی"}
  }
}

let selected=-1;
function select(i,cats,total){
  selected=(selected===i)?-1:i;
  document.querySelectorAll(".seg").forEach((s,k)=>{
    s.classList.toggle("active",k===selected);
    s.classList.toggle("dim",selected>=0&&k!==selected);
  });
  document.querySelectorAll(".row").forEach((r,k)=>r.classList.toggle("active",k===selected));
  const c=$("center");
  if(selected<0){
    c.innerHTML='<div class="sub">مجموع</div><div class="big">'+short(total)+'</div><div class="sub">تومان</div>';
  }else{
    const x=cats[selected];
    c.innerHTML='<div style="font-size:22px">'+esc(x[3])+'</div><div class="sub">'+esc(x[0])+'</div><div class="big">'+short(x[1])+
      '</div><div class="sub">'+fa(Math.round(x[1]/total*100))+'٪ · '+fa(x[2])+' مورد</div>';
  }
  haptic();
}

function changeBadge(now,prev){
  if(prev==null)return "";
  if(!prev)return '<span class="ch new">جدید</span>';
  const pct=Math.round((now-prev)/prev*100);
  if(!pct)return "";
  return '<span class="ch '+(pct>0?"up":"down")+'">'+(pct>0?"▲":"▼")+fa(Math.abs(pct))+'٪</span>';
}

function renderCategories(D){
  const cats=D.c,total=cats.reduce((a,c)=>a+c[1],0)||1;
  if(!cats.length){$("catCard").hidden=true;return}
  const R=70,C=2*Math.PI*R;let off=0,svg='<circle cx="100" cy="100" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="22"/>';
  cats.forEach((c,i)=>{
    const frac=c[1]/total,len=Math.max(frac*C-(cats.length>1?3:0),.5);
    svg+='<circle class="seg" data-i="'+i+'" data-len="'+len+'" cx="100" cy="100" r="'+R+'" fill="none" stroke="'+colorOf(c[4])+
      '" stroke-width="22" style="stroke-dasharray:0 '+C+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 100 100)"/>';
    off+=frac*C;
  });
  $("donut").innerHTML=svg;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll(".seg").forEach((s,i)=>{
      s.style.transitionDelay=(i*80)+"ms";
      s.style.strokeDasharray=s.dataset.len+" "+C;
    });
  }));
  const hasPrev=D.p>0;
  $("legend").innerHTML=cats.map((c,i)=>{
    const pct=c[1]/total*100;
    return '<div class="row" data-i="'+i+'"><span class="dot" style="background:'+colorOf(c[4])+'"></span>'+
      '<span class="name">'+esc(c[3])+" "+esc(c[0])+(hasPrev&&c.length>5?changeBadge(c[1],c[5]):"")+'</span>'+
      '<span class="val">'+fmt(c[1])+'<span class="pct">'+fa(Math.round(pct))+'٪</span></span>'+
      '<div class="track"><i style="background:'+colorOf(c[4])+'" data-w="'+pct+'"></i></div></div>';
  }).join("");
  setTimeout(()=>document.querySelectorAll(".legend .track i").forEach(i=>i.style.width=i.dataset.w+"%"),150);
  document.querySelectorAll(".seg,.row").forEach(el=>el.addEventListener("click",()=>select(+el.dataset.i,cats,total)));
  selected=-1;
  $("center").innerHTML='<div class="sub">مجموع</div><div class="big">'+short(total)+'</div><div class="sub">تومان</div>';
}

function renderDaily(D){
  const d=D.d;
  if(!d.length||!d.some(v=>v>0)){$("dayCard").hidden=true;return}
  const W=340,H=170,pl=6,pr=6,pt=12,pb=22,n=d.length,max=Math.max.apply(null,d),bw=(W-pl-pr)/n,gap=Math.min(3,bw*.25);
  const total=d.reduce((a,b)=>a+b,0),avg=total/n,ih=H-pt-pb;
  const pace=D.b>0&&D.l?D.b/D.l:0;               // budget per day
  const cmax=Math.max(total,pace*n)||1;          // scale of the cumulative line
  let s='<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--a1)"/><stop offset="1" stop-color="var(--a2)"/></linearGradient>'+
        '<linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--a2)" stop-opacity=".28"/><stop offset="1" stop-color="var(--a2)" stop-opacity="0"/></linearGradient></defs>';
  for(let g=1;g<=3;g++){const y=H-pb-ih*g/3;s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-dasharray="3 4"/>'}
  const cx=i=>W-pr-(i+.5)*bw; // RTL: day 1 on the right
  let cum=0,pts=[];
  d.forEach((v,i)=>{
    cum+=v;pts.push([cx(i),H-pb-ih*cum/cmax]);
    const h=v>0?Math.max(3,ih*v/max):0,x=cx(i)-bw/2+gap/2;
    if(v>0)s+='<rect class="bar" data-i="'+i+'" x="'+x+'" y="'+(H-pb-h)+'" width="'+Math.max(1,bw-gap)+'" height="'+h+'" rx="'+Math.min(4,bw/2)+
      '" fill="url(#bg)" style="transition-delay:'+(i*18)+'ms"/>';
    if((i+1)===1||(i+1)%5===0)s+='<text class="axis" x="'+cx(i)+'" y="'+(H-6)+'">'+fa(i+1)+'</text>';
  });
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  s+='<path class="cumArea" d="'+line+" L"+pts[pts.length-1][0].toFixed(1)+" "+(H-pb)+" L"+pts[0][0].toFixed(1)+" "+(H-pb)+' Z" fill="url(#ar)"/>';
  s+='<path class="cum" pathLength="1" d="'+line+'"/>';
  const ay=H-pb-ih*avg/max;
  s+='<line class="avgLine" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+ay+'" y2="'+ay+'"/>';
  if(pace)s+='<path class="paceLine" d="M'+(W-pr)+" "+(H-pb)+" L"+(W-pr-n*bw).toFixed(1)+" "+(H-pb-ih*pace*n/cmax).toFixed(1)+'"/>';
  $("daily").innerHTML=s;
  const peak=d.indexOf(max),zero=d.filter(v=>!v).length;
  const base="پرخرج‌ترین روز: روز <b>"+fa(peak+1)+"</b> با <b>"+fmt(max)+"</b> تومان";
  $("tip").innerHTML=base;
  $("dayNote").innerHTML='<span>ستون = هر روز</span><span class="key"><i style="border-color:var(--a2)"></i>جمع تجمعی</span>'+
    '<span class="key"><i style="border-color:var(--warn);border-top-style:dashed"></i>میانگین روزانه '+short(avg)+'</span>'+
    (pace?'<span class="key"><i style="border-color:var(--bad);border-top-style:dotted"></i>مسیر بودجه</span>':"")+
    (zero?'<span>'+fa(zero)+' روز بدون خرج 👌</span>':"");
  let cumAt=[],c2=0;d.forEach(v=>cumAt.push(c2+=v));
  document.querySelectorAll(".bar").forEach(b=>b.addEventListener("click",()=>{
    const was=b.classList.contains("sel");
    document.querySelectorAll(".bar.sel").forEach(x=>x.classList.remove("sel"));
    if(was){$("tip").innerHTML=base;return}
    b.classList.add("sel");const i=+b.dataset.i;
    $("tip").innerHTML="روز <b>"+fa(i+1)+"</b> · <b>"+fmt(d[i])+"</b> تومان · تا این روز "+short(cumAt[i]);
    haptic();
  }));
  requestAnimationFrame(()=>requestAnimationFrame(()=>$("dayCard").classList.add("go")));
}

function renderWeek(D){
  const w=D.w||[];
  if(w.length!==7||w.filter(v=>v>0).length<2){$("weekCard").hidden=true;return}
  const W=340,H=130,pt=20,pb=22,max=Math.max.apply(null,w),bw=(W-10)/7,bar=bw*.58,top=w.indexOf(max);
  let s='<defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--a1)"/><stop offset="1" stop-color="var(--a2)"/></linearGradient></defs>';
  w.forEach((v,i)=>{
    const cx=W-5-(i+.5)*bw,bh=v>0?Math.max(3,(H-pt-pb)*v/max):2,hi=i===top;
    s+='<rect x="'+(cx-bar/2)+'" y="'+(H-pb-bh)+'" width="'+bar+'" height="'+bh+'" rx="7" fill="'+(hi?"url(#wg)":"var(--line)")+
       '" style="transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.9,.25,1) '+(i*70)+'ms both"/>';
    if(v>0)s+='<text class="hlab" x="'+cx+'" y="'+(H-pb-bh-6)+'" style="fill:'+(hi?"var(--text)":"var(--muted)")+'">'+short(v)+'</text>';
    s+='<text class="axis" x="'+cx+'" y="'+(H-6)+'">'+WEEK[i]+'</text>';
  });
  $("week").innerHTML=s;
  const sum=w.reduce((a,b)=>a+b,0)||1;
  $("weekNote").innerHTML="<span>بیشترین خرج: روزهای <b>"+WEEK[top]+"</b> ("+fa(Math.round(max/sum*100))+"٪ از کل)</span>";
}

function renderHistory(D){
  const h=(D.h||[]).slice();
  while(h.length>2&&!h[0][1])h.shift();  // months before the first expense
  if(h.filter(x=>x[1]>0).length<2){$("histCard").hidden=true;return}
  const W=340,H=140,pt=22,pb=22,n=h.length,max=Math.max.apply(null,h.map(x=>x[1])),bw=(W-20)/n,bar=bw*.56;
  const past=h.slice(0,-1).filter(x=>x[1]>0),avg=past.length?past.reduce((a,x)=>a+x[1],0)/past.length:0;
  let s='<defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--a1)"/><stop offset="1" stop-color="var(--a2)"/></linearGradient></defs>';
  h.forEach((x,i)=>{
    const cur=i===n-1,cx=W-10-(n-1-i+.5)*bw,bh=Math.max(2,(H-pt-pb)*x[1]/max);
    s+='<rect class="hb" data-i="'+i+'" x="'+(cx-bar/2)+'" y="'+(H-pb-bh)+'" width="'+bar+'" height="'+bh+'" rx="7" fill="'+(cur?"url(#hg)":"var(--line)")+
       '" style="transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.9,.25,1) '+(i*90)+'ms both"/>';
    s+='<text class="hlab" x="'+cx+'" y="'+(H-pb-bh-6)+'" style="fill:'+(cur?"var(--text)":"var(--muted)")+'">'+short(x[1])+'</text>';
    s+='<text class="axis" x="'+cx+'" y="'+(H-6)+'">'+MONTHS[parseInt(x[0].slice(5,7),10)-1]+'</text>';
  });
  if(avg){const y=H-pb-(H-pt-pb)*avg/max;s+='<line x1="4" x2="'+(W-4)+'" y1="'+y+'" y2="'+y+'" stroke="var(--warn)" stroke-width="1.4" stroke-dasharray="4 4" opacity=".9"/>'}
  $("hist").innerHTML=s;
  const base=avg?"میانگین ماه‌های قبل: <b>"+short(avg)+"</b>"+(D.f>0?" · پیش‌بینی این ماه: <b>"+short(D.f)+"</b>":""):"";
  $("htip").innerHTML=base;
  document.querySelectorAll(".hb").forEach(b=>b.addEventListener("click",()=>{
    const x=h[+b.dataset.i];$("htip").innerHTML=monthName(x[0])+": <b>"+fmt(x[1])+"</b> تومان";haptic();
  }));
}

function renderPeople(D){
  const u=D.u||[];
  if(!u.length){$("peopleCard").hidden=true;return}
  const max=Math.max.apply(null,u.map(x=>x[1]));
  $("people").innerHTML=u.map(p=>'<div><div class="top"><span>👤 '+esc(p[0])+'</span><b>'+fmt(p[1])+'</b></div>'+
    '<div class="track"><i style="background:linear-gradient(90deg,var(--a1),var(--a2))" data-w="'+(p[1]/max*100)+'"></i></div></div>').join("");
  setTimeout(()=>document.querySelectorAll("#people .track i").forEach(i=>i.style.width=i.dataset.w+"%"),250);
}

function renderTop(D){
  const x=D.x||[];
  if(!x.length){$("topCard").hidden=true;return}
  $("top").innerHTML=x.map(e=>{
    const col=colorOf(e[5]);
    return '<div class="exp"><div class="ico" style="background:'+col+'26">'+esc(e[4])+'</div>'+
      '<div><div class="t">'+(esc(e[2])||esc(e[0]))+'</div><div class="d">'+esc(e[0])+' · روز '+fa(e[3])+'</div></div>'+
      '<div class="a">'+fmt(e[1])+'</div></div>';
  }).join("");
}

function renderStamp(D,isDemo){
  if(isDemo){$("stamp").textContent="این داده‌ها نمونه است؛ داشبورد واقعی را از داخل ربات باز کن.";return}
  if(!D.s)return;
  const p=D.s.split(/[- ]/);
  $("stamp").textContent="اطلاعات تا "+fa(+p[2])+" "+MONTHS[+p[1]-1]+" ساعت "+fa(p[3])+" · برای اطلاعات تازه دوباره از ربات باز کن";
}

function render(D,isDemo){
  $("demo").hidden=!isDemo;
  if(!D.n){
    $("app").innerHTML='<section class="card empty"><div class="big">📭</div><h2 style="justify-content:center">'+monthName(D.m)+'</h2><div class="muted">هنوز هزینه‌ای ثبت نشده</div></section>';
    return;
  }
  renderHero(D);renderCategories(D);renderDaily(D);renderWeek(D);renderHistory(D);renderPeople(D);renderTop(D);renderStamp(D,isDemo);
}

(function init(){
  const dark=()=>tg&&tg.colorScheme?tg.colorScheme==="dark":window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches;
  const applyTheme=()=>{const k=dark();document.documentElement.dataset.theme=k?"dark":"light";
    try{tg.setHeaderColor(k?"#0c0e13":"#f2f3f8");tg.setBackgroundColor(k?"#0c0e13":"#f2f3f8")}catch(e){}
    try{if(tg.isVersionAtLeast("7.10"))tg.setBottomBarColor(k?"#0c0e13":"#f2f3f8")}catch(e){}};
  applyTheme();
  if(tg){
    try{tg.ready();tg.expand();tg.onEvent("themeChanged",applyTheme)}catch(e){}
    try{if(tg.isVersionAtLeast("7.7"))tg.disableVerticalSwipes()}catch(e){}   // scrolling does not close the app
  }
  let D,demo=false;
  const p=new URLSearchParams(location.search).get("d");
  try{D=p?decode(p):(demo=true,demoData())}catch(e){
    $("app").innerHTML='<section class="card empty"><div class="big">⚠️</div><div class="muted">لینک داشبورد خراب است. دوباره از ربات /app بزن.</div></section>';return;
  }
  render(D,demo);
})();
</script>
</body>
</html>
